<section id="timeline" class="sec-dark py-20 lg:py-28">
  <div class="max-w-4xl mx-auto px-6 sm:px-10 lg:px-16">
    <p class="eyebrow mb-4">Work</p>
    <h2 class="font-display text-4xl sm:text-5xl leading-[0.95] mb-12">
      Things I've<br />
      <span class="muted-2">shipped.</span>
    </h2>

    <div class="relative">
      <div
        class="absolute left-[0.4375rem] top-2 bottom-2 w-px bg-white/10"
        aria-hidden="true"
      ></div>

      <div class="space-y-6">
        <article
          *ngFor="let entry of entries"
          class="relative pl-8"
        >
          <span
            class="absolute left-0 top-2 h-3.5 w-3.5 rounded-full border-2"
            [ngClass]="entry.featured
              ? 'border-accent bg-accent'
              : 'border-white/30 bg-white/20'"
            aria-hidden="true"
          ></span>

          <div
            class="rounded-2xl p-5 sm:p-6 card transition-colors"
            [class.card-hover]="!!entry.url"
            [ngStyle]="entry.featured ? {'border-color': 'rgba(255, 106, 26, 0.35)', 'background': 'rgba(255, 106, 26, 0.06)'} : {}"
          >
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div class="min-w-0 flex-1">
                <p *ngIf="entry.period" class="text-xs uppercase tracking-wider muted mb-1">
                  {{ entry.period }}
                </p>
                <h3 class="font-display text-xl sm:text-2xl">
                  <a
                    *ngIf="entry.url; else plainTitle"
                    [href]="entry.url"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="hover:text-accent transition-colors"
                  >
                    {{ entry.title }}
                  </a>
                  <ng-template #plainTitle>{{ entry.title }}</ng-template>
                </h3>
                <p class="mt-1.5 text-sm muted leading-relaxed">
                  {{ entry.description }}
                </p>
              </div>
              <a
                *ngIf="entry.url"
                [href]="entry.url"
                target="_blank"
                rel="noopener noreferrer"
                class="hidden sm:grid place-items-center h-10 w-10 shrink-0 rounded-full border border-white/15 text-white/70 hover:border-accent hover:text-accent transition-colors"
                [attr.aria-label]="'Visit ' + entry.title"
              >
                ↗
              </a>
            </div>
            <div *ngIf="entry.tags?.length" class="mt-3 flex flex-wrap gap-2">
              <span
                *ngFor="let tag of entry.tags"
                class="text-xs px-2.5 py-1 rounded-full border border-white/15 text-white/70"
              >
                {{ tag }}
              </span>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
