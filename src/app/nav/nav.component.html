<header class="fixed top-0 left-0 right-0 z-50 bg-ink/95 backdrop-blur-md border-b hair">
  <nav class="max-w-[92rem] mx-auto px-6 sm:px-10 lg:px-16 py-4">
    <div class="flex items-center justify-between">
      <a href="#" class="font-display text-lg font-bold text-white">Jelle Toonen</a>

      <button
        (click)="mobileOpen = !mobileOpen"
        type="button"
        class="inline-flex items-center p-2 text-white/70 rounded-lg md:hidden hover:bg-white/5"
        aria-label="Toggle menu"
      >
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </button>

      <ul
        class="flex-col md:flex md:flex-row md:items-center md:gap-8 absolute md:relative top-full left-0 right-0 md:top-auto sec-dark md:bg-transparent border-b md:border-0 hair p-4 md:p-0 gap-1"
        [class.hidden]="!mobileOpen"
        [class.flex]="mobileOpen"
      >
        <li>
          <a
            href="#about"
            class="block py-2 md:py-0 text-sm text-white/70 hover:text-white transition-colors"
            (click)="mobileOpen = false"
          >About</a>
        </li>
        <li>
          <a
            href="#education"
            class="block py-2 md:py-0 text-sm text-white/70 hover:text-white transition-colors"
            (click)="mobileOpen = false"
          >Education</a>
        </li>
        <li>
          <a
            href="#timeline"
            class="block py-2 md:py-0 text-sm text-white/70 hover:text-white transition-colors"
            (click)="mobileOpen = false"
          >Work</a>
        </li>
        <li>
          <a
            href="https://nightdev.io"
            target="_blank"
            rel="noopener noreferrer"
            class="block py-2 md:py-0 text-sm font-medium text-accent hover:text-accent/80 transition-colors"
          >NightDev →</a>
        </li>
      </ul>
    </div>
  </nav>
</header>
